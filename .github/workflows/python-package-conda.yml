name: Run Python Automation

on:
  workflow_dispatch:
  push:

jobs:
  run-script:
    runs-on: windows-latest

    steps:
      - name: Download project
        uses: actions/checkout@v4

      - name: Install Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install packages
        run: |
          pip install -r requirements.txt

      - name: Start script
        run: python force_brute.py
